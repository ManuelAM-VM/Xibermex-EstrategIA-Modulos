version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: strategia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-strategia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/setup.sql:/docker-entrypoint-initdb.d/01_setup.sql
      - ./prisma/seed_base.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strategia_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategia_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-strategia_db}?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - strategia_net

volumes:
  postgres_data:

networks:
  strategia_net:
    driver: bridge
